spring:
  datasource:
    url: jdbc:mysql://116.62.237.84:3306/caregiver?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 303803
    driver-class-name: com.mysql.cj.jdbc.Driver
    # --- 新增 HikariCP 连接池配置 ---
    hikari:
      # 最大生命周期 (毫秒)：设置为 10 分钟 (600000ms)，必须小于 MySQL 的 wait_timeout (默认通常是 8 小时)
      # 建议设置为比 MySQL wait_timeout 短几分钟
      max-lifetime: 600000

      # 连接超时时间 (毫秒)：获取连接的最大等待时间
      connection-timeout: 30000

      # 最小空闲连接数
      minimum-idle: 5

      # 最大连接数
      maximum-pool-size: 20

      # 空闲连接最大存活时间 (毫秒)：空闲连接超过这个时间会被回收
      idle-timeout: 600000

      # 连接测试查询 (可选，HikariCP 通常会自动处理，但加上更稳)
      connection-test-query: SELECT 1

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ck0731.caregiver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0